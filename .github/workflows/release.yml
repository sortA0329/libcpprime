name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: Tag name to release (empty = auto-detect from README.md)
                required: false
                default: ""
                type: string

permissions:
    contents: write

jobs:
    release:
        name: Create GitHub Release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
                  fetch-tags: true

            - name: Setup mise tools
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
              with:
                  cache: false

            - name: Resolve tag and version
              id: meta
              env:
                  INPUT_TAG: ${{ inputs.tag }}
              run: |
                  if [ -n "${INPUT_TAG}" ]; then
                    TAG="${INPUT_TAG}"
                    case "${TAG}" in
                      v*|V*) ;;
                      *) TAG="v${TAG}" ;;
                    esac
                  elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                    TAG="${GITHUB_REF_NAME}"
                  else
                    # Auto-detect the latest version from the Releases section of README.md.
                    VERSION="$(python3 -c 'import re,sys; m=re.search(r"^\s*-\s+\S+\s+ver\s+(\S+)\s*$", open("README.md", encoding="utf-8").read(), re.M); sys.stdout.write(m.group(1) if m else "")')"
                    if [ -z "${VERSION}" ]; then
                      echo "Error: could not detect version from README.md. Specify tag manually." >&2
                      exit 1
                    fi
                    TAG="v${VERSION}"
                  fi
                  VERSION="${TAG#v}"
                  VERSION="${VERSION#V}"
                  echo "TAG=${TAG}" >> "$GITHUB_ENV"
                  echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Releasing ${TAG} (version ${VERSION})"

            - name: Checkout release tag
              if: ${{ inputs.tag != '' }}
              env:
                  TAG: ${{ steps.meta.outputs.tag }}
              run: |
                  git fetch origin --tags
                  if git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
                    git checkout "${TAG}"
                  else
                    echo "Tag ${TAG} does not exist yet; staying on the dispatched ref so the release step creates it."
                  fi

            - name: Bundle headers
              run: |
                  mise run bundle
                  ls -la bundled/

            - name: Extract changelog from README
              run: mise x -- uv run scripts/extract_changelog.py --version "$VERSION" --readme README.md --output RELEASE_BODY.md

            - name: Show release body
              run: cat RELEASE_BODY.md

            - name: Create GitHub Release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 # zizmor: ignore[superfluous-actions] keep dedicated action for asset upload behavior
              with:
                  tag_name: ${{ steps.meta.outputs.tag }}
                  name: ${{ steps.meta.outputs.tag }}
                  body_path: RELEASE_BODY.md
                  files: bundled/*.hpp
                  fail_on_unmatched_files: true
                  generate_release_notes: false
