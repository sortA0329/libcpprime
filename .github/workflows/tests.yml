name: Tests

on:
    push:
        branches: [main]
        paths:
            - "include/**"
            - "tests/**"
            - "CMakeLists.txt"
            - "mise.toml"
            - ".github/workflows/tests.yml"
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    linux:
        name: Linux (${{ matrix.compiler }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - compiler: gcc
                      build_dir: build-gcc
                      cc: gcc
                      cxx: g++
                    - compiler: clang
                      build_dir: build-clang
                      cc: clang
                      cxx: clang++
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - name: Setup mise tools
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
            - name: Cache build dir (${{ matrix.compiler }})
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ matrix.build_dir }}
                  key: ${{ runner.os }}-${{ matrix.compiler }}-build-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.compiler }}-build-
            - name: Run tests (${{ matrix.compiler }})
              env:
                  CC: ${{ matrix.cc }}
                  CXX: ${{ matrix.cxx }}
              run: mise run test:${{ matrix.compiler }}

    windows:
        name: Windows (${{ matrix.compiler }})
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - compiler: msvc
                      build_dir: build-msvc
                    - compiler: clang-cl
                      build_dir: build-clang-cl
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Install LLVM (clang-cl)
              if: matrix.compiler == 'clang-cl'
              shell: pwsh
              run: |
                  choco install llvm -y --no-progress

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: ${{ matrix.build_dir }}
                  key: ${{ runner.os }}-${{ matrix.compiler }}-build-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '**/*.cmake') }}
                  restore-keys: |
                      ${{ runner.os }}-${{ matrix.compiler }}-build-

            - name: Setup mise tools
              uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

            - name: Run tests (${{ matrix.compiler }})
              run: mise run test:${{ matrix.compiler }}
